[project]
name = "vectorist"
version = "0.1.0"
description = "Code-centric document ingestion and vector retrieval for RAG agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "markdown-it-py>=3.0.0",
  "mdit-py-plugins>=0.4.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-go>=0.23.0",
  "tree-sitter-rust>=0.23.0",
  "tree-sitter-java>=0.23.0",
  "fastembed>=0.4.0",
  "sqlite-vec>=0.1.0",
  "asyncpg>=0.30.0",
  "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
cli = [
  "httpx>=0.27.0",
]
crawl = [
  "httpx>=0.27.0",
  "playwright>=1.48.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[project.scripts]
vectorist = "vectorist.__main__:main"
vectorist-cli = "vectorist.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectorist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not embedder'"
markers = [
  "backends: runs against every vector backend; pgvector needs VECTORIST_PG_URL",
  "live: starts a real server process",
  "embedder: downloads and runs the real embedding model",
  "crawl: needs Playwright and Chromium",
]
